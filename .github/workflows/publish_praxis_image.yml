name: Publish Praxis Chatwoot image

on:
  push:
    branches:
      - praxis
  workflow_dispatch:

concurrency:
  group: praxis-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GX10 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/larik-pr/chatwoot:praxis-v4.17.1
            ghcr.io/larik-pr/chatwoot:praxis-${{ github.sha }}
          cache-from: type=gha,scope=praxis-linux-arm64
          cache-to: type=gha,mode=max,scope=praxis-linux-arm64
